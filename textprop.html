<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS-Text Property</title>


    <style>
        h1 {
            color: blue;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;

        }
        p {
            color: green;
            text-align: justify;
            font-size: 20px;
            letter-spacing: 2px;
            line-height: 1.5;

        }
    </style>
</head>
<body>
    <h1>Internal CSS</h1>
    <P> CSS is used to design and style HTML web pages.
        Internal CSS is written inside the style tag in the head section.
    </P>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin and Padding</title>
   <style>
    .div{
        border: 10px solid;
        border-radius: 20px;
        margin: 40px 40px 50px 20px;
        padding: 20px 20px 40px 40px;
    }
   </style>
</head>
<body>
    <div class="div">
   <h1>This is padding and margin</h1>

</div>
</body>
</html>

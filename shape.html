<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different shape</title>
    <style>
        .circle{
            width: 100px;
            height: 100px;
            background: red;
            border-radius: 50%;
            
        }
        
        .square{
            width: 100px;
            height: 100px;
            background: burlywood;
        }
        .rectangle{
            width: 150px;
            height: 80px;
            background: greenyellow;
        }
       
        .oval{
            width: 140px;
            height: 80px;
            background: papayawhip;
            border-radius: 50%;
        }
        .diamond{
            width: 80px;
            height: 80px;
            background: yellowgreen;
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <h1> Different Shapes</h1>
    
    <div class="circle"></div><br><br>
    <div class="square"></div><br><br>
    <div class="rectangle"></div><br><br>
    <div class="triangle"></div><br><br>
    <div class="oval"></div><br><br>
    <div class="diamond"></div><br><br>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doner registration</title>
</head>
<body>
    <p><b><center>BLOOD DONATION REGISTRATION FORM</center></b></p>
    <P><b>BLOOD DONOR DETAILS</b></P>
    <form>
       FULL NAME: <input type="text" name="username" placeholder="enter full name"/><br><br> 
       TYPE: <input type="text" name="type" placeholder="select type"/><br><br>
      
       BLOOD GROUP: <input type="text" name="blood group"  placeholder="select blood group"/><br><br>
       STATE: <input type="text" name="state" placeholder="select"/><br><br>
       CITY: <input type="text"  name="city" placeholder="select"/><br><br>
       PHONE: <input type="text" name="phone" placeholder="enter number"/><br><br>
       EMAIL: <input type="text" name="email" placeholder="enter email"/><br><br>
        PASSWORD: <input type="password" name="password" placeholder="enter passworrd"/><br><br>
        CONFIRM PASSWORD: <input type="password" name="confirm password" placeholder="confirm password"/><br><br>
        ADDRESS: <textarea rows="5" cols="10"></textarea><br><br>
        LAST TIME BLOOD DONATED: <input type="text" name="last time blood dopnated" placeholder="not ever donated"/><br><br>
        <input type="button"value="submit" name="submit">
        </form>
</body>
</html>
